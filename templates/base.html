{% load django_htmx %}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Veille{% endblock %} — Veille cyber &amp; normative</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D13; --surface:#0F131B; --border:#1E2530;
    --text:#FFFFFF; --text-muted:#8A95A6; --text-faint:#4B5566;
    --accent:#2667FF; --accent-dim:rgba(38,103,255,0.12); --accent-dim2:rgba(38,103,255,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'IBM Plex Sans',sans-serif; color:var(--text); font-size:13.5px;
    background:
      linear-gradient(rgba(38,103,255,0.07) 1px, transparent 1px) 0 0/44px 44px,
      linear-gradient(90deg, rgba(38,103,255,0.07) 1px, transparent 1px) 0 0/44px 44px,
      var(--bg);
    min-height:100vh;
  }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  a{ color:inherit; }

  .bracket{ position:relative; }
  .bracket span{ position:absolute; width:14px; height:14px; pointer-events:none; }
  .bracket span.tl{ top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
  .bracket span.tr{ top:-1px; right:-1px; border-top:2px solid var(--accent); border-right:2px solid var(--accent); }
  .bracket span.bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--accent); border-left:2px solid var(--accent); }
  .bracket span.br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); }

  header.topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--border); }
  header.topbar .brand{ font-family:'Archivo',sans-serif; font-weight:700; letter-spacing:0.05em; color:var(--accent); text-transform:uppercase; font-size:13px; }
  nav.topnav{ display:flex; gap:4px; }
  nav.topnav a{ padding:7px 12px; border-radius:5px; font-size:12.5px; color:var(--text-muted); text-decoration:none; }
  nav.topnav a:hover{ color:var(--text); background:rgba(255,255,255,0.03); }
  nav.topnav a.active{ color:var(--accent); background:var(--accent-dim); }
  .user-menu{ font-size:12px; color:var(--text-faint); display:flex; align-items:center; gap:12px; }
  .user-menu a{ color:var(--text-faint); text-decoration:underline; }

  main{ padding:32px 24px 64px; }
  h1.section{ max-width:920px; margin:0 auto 16px; font-size:13px; font-family:'Archivo',sans-serif; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.05em; }
  .page{ max-width:920px; margin:0 auto 64px; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
{% if user.is_authenticated %}
<header class="topbar">
  <span class="brand">veille_</span>
  <nav class="topnav">
    <a href="{% url 'panel:renseignements' %}" class="{% block nav_renseignements %}{% endblock %}">Renseignements</a>
    <a href="{% url 'panel:traitement' %}" class="{% block nav_traitement %}{% endblock %}">Traitement</a>
    <a href="{% url 'panel:actualites' %}" class="{% block nav_actualites %}{% endblock %}">Actualités</a>
    <a href="{% url 'panel:organisation' %}" class="{% block nav_organisation %}{% endblock %}">Organisation</a>
    <a href="{% url 'panel:profil' %}" class="{% block nav_profil %}{% endblock %}">Profil</a>
  </nav>
  <span class="user-menu">{{ user.username }}<a href="{% url 'accounts:logout' %}">déconnexion</a></span>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
