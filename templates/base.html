{% load django_htmx %}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Veille{% endblock %} — Veille cyber &amp; normative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D11; --surface:#12151A; --border:#1E242B;
    --text:#F5F6F7; --text-muted:#9199A2; --text-faint:#565D66;
    --accent:#3B6FE0; --accent-dim:rgba(59,111,224,0.12); --accent-dim2:rgba(59,111,224,0.20);
    --sev-critique:#D6555A; --sev-elevee:#C97C3D; --sev-moyenne:#B9A24E; --sev-faible:#5B626B;
    --st-encours:#3B6FE0; --st-clos:#4C9A73; --st-na:#6E7580;
    --font-display:'Archivo',sans-serif; --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:13.5px; line-height:1.5; min-height:100vh; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  a{ color:inherit; }

  .app{ display:flex; min-height:100vh; align-items:stretch; }

  .sidenav{ width:212px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; align-self:flex-start; height:100vh; }
  .sidenav .brand{ font-family:var(--font-display); font-weight:700; letter-spacing:0.04em; color:var(--text); text-transform:uppercase; font-size:13px; padding:0 10px; margin-bottom:24px; }
  .sidenav .brand b{ color:var(--accent); }
  .sidenav-links{ display:flex; flex-direction:column; gap:2px; }
  .sidenav-links a{ padding:9px 12px; border-radius:6px; font-size:12.5px; color:var(--text-muted); text-decoration:none; }
  .sidenav-links a:hover{ color:var(--text); background:rgba(255,255,255,0.03); }
  .sidenav-links a.active{ color:var(--accent); background:var(--accent-dim); border-left:2px solid var(--accent); padding-left:10px; }
  .sidenav .user-menu{ margin-top:auto; padding:14px 12px 0; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-faint); line-height:1.8; }
  .sidenav .user-menu a{ color:var(--text-faint); text-decoration:underline; }

  .stage{ flex:1; min-width:0; padding:36px 32px 72px; }

  a, button, input, select, textarea{ transition:border-color .12s ease, background-color .12s ease, color .12s ease, filter .12s ease; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;
  }
  button:not(:disabled):hover, .btn:hover, .btn-ghost:hover, .btn-primary:hover{ filter:brightness(1.12); }
  button:not(:disabled):active, .btn:active, .btn-ghost:active, .btn-primary:active{ filter:brightness(0.94); }
  h1.section{ margin:0 0 16px; font-size:12.5px; font-family:var(--font-display); font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.07em; }
  .page{ max-width:960px; margin:0 0 48px; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
<div class="app">
{% if user.is_authenticated %}
<aside class="sidenav">
  <div class="brand">veille<b>_</b></div>
  <nav class="sidenav-links">
    <a href="{% url 'panel:renseignements' %}" class="{% block nav_renseignements %}{% endblock %}">Renseignements</a>
    <a href="{% url 'panel:traitement' %}" class="{% block nav_traitement %}{% endblock %}">Traitement</a>
    <a href="{% url 'panel:actualites' %}" class="{% block nav_actualites %}{% endblock %}">Actualités</a>
    <a href="{% url 'panel:organisation' %}" class="{% block nav_organisation %}{% endblock %}">Organisation</a>
    <a href="{% url 'panel:profil' %}" class="{% block nav_profil %}{% endblock %}">Profil</a>
  </nav>
  <div class="user-menu">{{ user.username }}<br><a href="{% url 'accounts:logout' %}">déconnexion</a></div>
</aside>
{% endif %}
<main class="stage">
{% block content %}{% endblock %}
</main>
</div>
</body>
</html>
