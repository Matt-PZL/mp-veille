{% load panel_extras %}
<h2>Ajouter un actif ou un référentiel</h2>
<form method="post" action="{% url 'panel:ajouter_actif' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next_actif|default:'' }}">
  <div class="add-row type-toggle">
    <div class="type-radio">
      <input type="radio" name="type" value="technique" id="type-technique" checked onclick="toggleTypeFields()">
      <label for="type-technique">Technique</label>
    </div>
    <div class="type-radio">
      <input type="radio" name="type" value="normatif" id="type-normatif" onclick="toggleTypeFields()">
      <label for="type-normatif">Normatif</label>
    </div>
  </div>

  <div class="add-row fields-technique show" id="fields-technique-search">
    <div style="flex:1; position:relative;" class="combo">
      <span class="lbl">Rechercher un produit (ex : ubuntu, debian, pan-os…)</span>
      <input type="text" id="produit-search-input" autocomplete="off" placeholder="Tapez le nom du produit…" oninput="produitSearchFilter()" onfocus="produitSearchFilter()">
      <div class="combo-list" id="produit-search-list" hidden></div>
    </div>
  </div>
  <div class="add-row-sep fields-technique show">ou choisissez par catégorie</div>

  <div class="add-row fields-technique show" id="fields-technique">
    <div style="flex:1;"><span class="lbl">Catégorie</span>
      <select name="categorie" id="sel-categorie" onchange="onCategorieChange()">
        <option value="">— Choisir —</option>
      </select>
    </div>
    <div style="flex:1;"><span class="lbl">Éditeur</span>
      <select name="editeur" id="sel-editeur" onchange="onEditeurChange()" disabled>
        <option value="">— Choisir une catégorie d'abord —</option>
      </select>
    </div>
  </div>
  <div class="add-row fields-technique show">
    <div style="flex:1;"><span class="lbl">Produit</span>
      <select name="produit" id="sel-produit" onchange="onProduitChange()" disabled>
        <option value="">— Choisir un éditeur d'abord —</option>
      </select>
    </div>
    <div style="flex:1;">
      <span class="lbl">Version (optionnel)</span>
      <select id="sel-version" onchange="onVersionChange()" disabled>
        <option value="">— Choisir un produit d'abord —</option>
      </select>
      <input type="text" id="input-version-libre" placeholder="Saisir la version" style="display:none; margin-top:6px;">
    </div>
  </div>
  <div class="add-row fields-normatif" id="fields-normatif">
    <div style="flex:1;"><span class="lbl">Référentiel</span>
      <select name="referentiel">
        <option value="">— Choisir —</option>
        {% for r in referentiels %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <button type="submit" class="btn-primary" style="margin-top:6px;">Ajouter</button>
</form>
<script>
  const TAXONOMIE = {{ taxonomie_json|safe }};
  const VERSIONS_CONNUES = {{ versions_json|default:"{}"|safe }};

  // Index plat "produit -> {categorie, editeur}" pour la recherche libre —
  // le catalogue (~470 produits) rend le parcours par categorie/editeur
  // fastidieux si on ne sait pas d'avance ou ranger son produit.
  const INDEX_PRODUITS = [];
  for (const categorie in TAXONOMIE) {
    for (const editeur in TAXONOMIE[categorie]) {
      for (const produit of TAXONOMIE[categorie][editeur]) {
        INDEX_PRODUITS.push({ produit, editeur, categorie });
      }
    }
  }

  function toggleTypeFields(){
    const technique = document.getElementById('type-technique').checked;
    document.querySelectorAll('.fields-technique').forEach(el => el.classList.toggle('show', technique));
    document.querySelectorAll('.fields-normatif').forEach(el => el.classList.toggle('show', !technique));
  }

  function fillSelect(select, options, placeholder){
    select.innerHTML = '<option value="">' + placeholder + '</option>' +
      options.map(o => '<option value="' + o + '">' + o + '</option>').join('');
  }

  function reinitialiserVersion(placeholder){
    const versionSelect = document.getElementById('sel-version');
    const versionLibre = document.getElementById('input-version-libre');
    versionSelect.disabled = true;
    versionSelect.removeAttribute('name');
    fillSelect(versionSelect, [], placeholder);
    versionLibre.removeAttribute('name');
    versionLibre.style.display = 'none';
    versionLibre.value = '';
  }

  function onCategorieChange(){
    const categorie = document.getElementById('sel-categorie').value;
    const editeurSelect = document.getElementById('sel-editeur');
    const produitSelect = document.getElementById('sel-produit');
    if (categorie && TAXONOMIE[categorie]) {
      fillSelect(editeurSelect, Object.keys(TAXONOMIE[categorie]), '— Choisir —');
      editeurSelect.disabled = false;
    } else {
      editeurSelect.disabled = true;
      fillSelect(editeurSelect, [], '— Choisir une catégorie d’abord —');
    }
    produitSelect.disabled = true;
    fillSelect(produitSelect, [], '— Choisir un éditeur d’abord —');
    reinitialiserVersion('— Choisir un produit d’abord —');
  }

  function onEditeurChange(){
    const categorie = document.getElementById('sel-categorie').value;
    const editeur = document.getElementById('sel-editeur').value;
    const produitSelect = document.getElementById('sel-produit');
    if (categorie && editeur && TAXONOMIE[categorie] && TAXONOMIE[categorie][editeur]) {
      fillSelect(produitSelect, TAXONOMIE[categorie][editeur], '— Choisir —');
      produitSelect.disabled = false;
    } else {
      produitSelect.disabled = true;
      fillSelect(produitSelect, [], '— Choisir un éditeur d’abord —');
    }
    reinitialiserVersion('— Choisir un produit d’abord —');
  }

  function onProduitChange(){
    const produit = document.getElementById('sel-produit').value;
    const versionSelect = document.getElementById('sel-version');
    const versionLibre = document.getElementById('input-version-libre');
    if (!produit) { reinitialiserVersion('— Choisir un produit d’abord —'); return; }
    const versions = VERSIONS_CONNUES[produit] || [];
    versionSelect.innerHTML = '<option value="">— Aucune (optionnel) —</option>' +
      versions.map(v => '<option value="' + v + '">' + v + '</option>').join('') +
      '<option value="__autre__">Autre (saisir)…</option>';
    versionSelect.disabled = false;
    versionSelect.name = 'version';
    versionLibre.removeAttribute('name');
    versionLibre.style.display = 'none';
    versionLibre.value = '';
  }

  function onVersionChange(){
    const versionSelect = document.getElementById('sel-version');
    const versionLibre = document.getElementById('input-version-libre');
    if (versionSelect.value === '__autre__') {
      versionSelect.removeAttribute('name');
      versionLibre.name = 'version';
      versionLibre.style.display = 'block';
      versionLibre.focus();
    } else {
      versionSelect.name = 'version';
      versionLibre.removeAttribute('name');
      versionLibre.style.display = 'none';
      versionLibre.value = '';
    }
  }

  function produitSearchFilter(){
    const q = document.getElementById('produit-search-input').value.trim().toLowerCase();
    const list = document.getElementById('produit-search-list');
    if (!q) { list.hidden = true; list.innerHTML = ''; return; }
    const matches = INDEX_PRODUITS.filter(e => e.produit.toLowerCase().includes(q)).slice(0, 30);
    if (!matches.length) {
      list.innerHTML = '<div class="combo-empty">Aucun produit ne correspond — vous pouvez aussi choisir par catégorie ci-dessous.</div>';
    } else {
      list.innerHTML = matches.map(e =>
        '<div class="combo-opt" onclick="produitSearchSelect(\'' + e.categorie.replace(/'/g, "\\'") + '\', \'' + e.editeur.replace(/'/g, "\\'") + '\', \'' + e.produit.replace(/'/g, "\\'") + '\')">' +
        '<b>' + e.produit + '</b><span class="combo-sub"> — ' + e.editeur + ' · ' + e.categorie + '</span></div>'
      ).join('');
    }
    list.hidden = false;
  }

  function produitSearchSelect(categorie, editeur, produit){
    document.getElementById('produit-search-input').value = produit;
    document.getElementById('produit-search-list').hidden = true;

    const catSelect = document.getElementById('sel-categorie');
    catSelect.value = categorie;
    onCategorieChange();
    const eduSelect = document.getElementById('sel-editeur');
    eduSelect.value = editeur;
    onEditeurChange();
    const prodSelect = document.getElementById('sel-produit');
    prodSelect.value = produit;
    onProduitChange();
  }

  document.addEventListener('click', function(e){
    const list = document.getElementById('produit-search-list');
    if (list && !list.hidden && !list.parentElement.contains(e.target)) list.hidden = true;
  });

  fillSelect(document.getElementById('sel-categorie'), Object.keys(TAXONOMIE), '— Choisir —');
</script>
