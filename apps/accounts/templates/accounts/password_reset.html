{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block extra_head %}
<style>
  .auth-wrap{ min-height:calc(100vh - 110px); display:flex; align-items:center; justify-content:center; }
  .auth-card{
    width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-lg); padding:34px 32px; box-shadow:var(--shadow-lg); text-align:center;
  }
  .auth-card h1{ font-family:var(--display); font-size:17px; font-weight:700; letter-spacing:-0.02em; margin:14px 0 8px; }
  .auth-card p{ color:var(--ink-soft); font-size:13px; line-height:1.65; }
  .auth-foot{ display:inline-block; margin-top:22px; font-size:12.5px; color:var(--ink-faint); }
  .auth-foot:hover{ color:var(--ink-soft); }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="empty-ico" style="margin:0 auto;"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
    <h1>Mot de passe oublié</h1>
    <p>Fonctionnalité à implémenter (envoi d'email de réinitialisation).</p>
    <a class="auth-foot" href="{% url 'accounts:login' %}">← Retour à la connexion</a>
  </div>
</div>
{% endblock %}
