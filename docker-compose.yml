services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on: [db, redis]
    networks: [internal]

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: .env
    volumes:
      - .:/app
    depends_on: [db, redis]
    networks: [internal]

  beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: .env
    volumes:
      - .:/app
    depends_on: [db, redis]
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Volumes anonymes : garde les node_modules installes dans l'image et le
      # cache de build, que le montage du dossier hote ecraserait sinon.
      - /app/node_modules
      - /app/.next
    environment:
      # Ne PAS fixer NODE_ENV ici : Next le positionne lui-meme selon la
      # commande (development pour `next dev`, production pour `next build`).
      # Le figer a "development" cassait le build de production.
      - WATCHPACK_POLLING=true
      # Le navigateur appelle l'API depuis la machine hote, pas depuis le
      # reseau Docker : l'URL doit donc rester localhost, pas "web".
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on: [web]
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  db_data:
