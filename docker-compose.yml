services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on: [db, redis]
    networks: [internal]

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: .env
    volumes:
      - .:/app
    depends_on: [db, redis]
    networks: [internal]

  beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: .env
    volumes:
      - .:/app
    depends_on: [db, redis]
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  db_data:
